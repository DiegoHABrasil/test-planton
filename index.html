<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Teste</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #0f172a;
      color: #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    .box {
      text-align: center;
      padding: 40px;
      border-radius: 12px;
      background-color: #1e293b;
      box-shadow: 0 0 20px rgba(0,0,0,0.3);
    }
    h1 {
      color: #22c55e;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>✅ Funcionou</h1>
    <p>Você chegou na página com sucesso.</p>
    <p id="hora"></p>
  </div>

  <script>
    const agora = new Date();
    document.getElementById("hora").innerText =
      "Horário: " + agora.toLocaleString();
  </script>
</body>
</html>
